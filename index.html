<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>欠席カウンター</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 12px 90px;
      min-height: 100vh;
    }

    h1 {
      font-size: 22px;
      text-align: center;
      margin: 10px 0 20px;
      font-weight: 600;
    }

    .semester-history {
      margin: 12px 0 16px;
    }

    .semester-history-title {
      margin: 0 0 8px;
      font-size: 12px;
      color: #777;
    }

    .semester-history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .semester-history-item {
      display: inline-flex;
      align-items: stretch;
      overflow: hidden;
      border: 1px solid #d5d5d5;
      border-radius: 8px;
      background: #fff;
    }

    .semester-chip {
      border: 0;
      background: transparent;
      color: #555;
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .semester-history-item.current {
      border-color: #2674c9;
      background: #2674c9;
      box-shadow: 0 0 0 2px rgba(38, 116, 201, 0.16);
    }

    .semester-history-item.current .semester-chip {
      color: #fff;
      font-weight: 700;
    }

    .semester-delete {
      border: 0;
      border-left: 1px solid rgba(120, 120, 120, 0.25);
      padding: 0 8px;
      background: rgba(0, 0, 0, 0.04);
      color: #777;
      font-size: 14px;
      cursor: pointer;
    }

    .semester-history-item.current .semester-delete {
      color: #fff;
      border-left-color: rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.08);
    }

    .semester-dialog-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.35);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .semester-dialog-backdrop.open {
      display: flex;
    }

    .semester-dialog {
      width: 100%;
      max-width: 340px;
      background: #fff;
      border-radius: 14px;
      padding: 22px 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
    }

    .semester-dialog h2 {
      font-size: 18px;
      margin: 0 0 8px;
      text-align: center;
    }

    .semester-dialog p {
      margin: 0 0 16px;
      color: #666;
      font-size: 13px;
      text-align: center;
    }

    .semester-dialog select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      font-size: 16px;
      margin-bottom: 16px;
    }

    .semester-dialog-actions {
      display: flex;
      gap: 10px;
    }

    .semester-dialog-actions button {
      flex: 1;
      border: 0;
      border-radius: 8px;
      padding: 11px 8px;
      font-size: 14px;
      background: #e5e5e5;
      color: #333;
      cursor: pointer;
    }

    .semester-dialog-actions button.primary {
      background: #2674c9;
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 4px;
      table-layout: fixed;
    }

    th {
      height: 42px;
      font-size: 14px;
      font-weight: 500;
    }

    th:first-child {
      width: 42px;
    }

    td {
      height: 72px;
      text-align: center;
      vertical-align: middle;

      border-radius: 8px;

      font-size: 26px;
      font-weight: 500;

      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;

      border: 2px solid transparent;

      transition:
        transform 0.08s,
        background-color 0.15s,
        border-color 0.15s;
    }

    td:active {
      transform: scale(0.96);
    }

    /* 選択中 */
    td.selected {
      border-color: #555;
    }

    /* 授業なし */
    td.empty {
      background: #e9e9e9;
      color: transparent;
    }

    /* 0回 */
    td.blue {
      background: #dceeff;
      color: #2674c9;
    }

    /* 安全圏 */
    td.green {
      background: #e1f3e1;
      color: #31833b;
    }

    /* 上限-1 */
    td.yellow {
      background: #fff3c4;
      color: #8a6d00;
    }

    /* 上限到達 */
    td.danger {
      background: #ffdede;
      color: #d33;
    }

    /* カウントボタン */
    .counter-buttons {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    .counter-buttons button {
      flex: 1;
      height: 52px;

      border: none;
      border-radius: 10px;

      font-size: 18px;
      font-weight: 500;

      cursor: pointer;

      background: #e5e5e5;
      color: #333;
    }

    .counter-buttons button:active {
      transform: scale(0.97);
    }

    .counter-buttons button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* 学期移動 */
    .semester-navigation {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12px;

      max-width: 700px;
      margin: 0 auto;

      padding: 0 16px;

      display: flex;
      justify-content: space-between;

      pointer-events: none;
    }

    .semester-navigation button {
      pointer-events: auto;

      border: none;
      background: #ddd;
      color: #444;

      padding: 10px 14px;
      border-radius: 8px;

      font-size: 13px;
      cursor: pointer;
    }

    .semester-navigation button:active {
      transform: scale(0.97);
    }

    .semester-navigation .hidden {
      visibility: hidden;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>欠席カウンター</h1>

<table>

      <thead>
        <tr>
          <th></th>
          <th>月</th>
          <th>火</th>
          <th>水</th>
          <th>木</th>
          <th>金</th>
          <th>土</th>
        </tr>
      </thead>

      <tbody id="schedule"></tbody>

    </table>

    <div class="semester-history" aria-label="追加済みの学期一覧">
      <p class="semester-history-title">追加した学期（青色が現在表示中）</p>
      <div class="semester-history-list" id="semesterHistoryList"></div>
    </div>

    <div class="counter-buttons">

      <button
        id="decreaseButton"
        onclick="decreaseSelected()"
      >
        −
      </button>

      <button
        id="increaseButton"
        onclick="increaseSelected()"
      >
        ＋
      </button>

    </div>

  </div>


  <div class="semester-dialog-backdrop" id="semesterDialogBackdrop" role="dialog" aria-modal="true" aria-labelledby="semesterDialogTitle">
    <div class="semester-dialog">
      <h2 id="semesterDialogTitle">次の学期を選択</h2>
      <p>新しい欠席表を作成する学期を選んでね。</p>
      <select id="targetSemesterSelect" aria-label="次に表示する学期">
        <option value="0">1年1学期</option>
        <option value="1">1年2学期</option>
        <option value="2">2年1学期</option>
        <option value="3">2年2学期</option>
        <option value="4">3年1学期</option>
        <option value="5">3年2学期</option>
        <option value="6">4年1学期</option>
        <option value="7">4年2学期</option>
      </select>
      <div class="semester-dialog-actions">
        <button type="button" onclick="closeSemesterDialog()">キャンセル</button>
        <button type="button" class="primary" onclick="confirmNextSemester()">新しい表を作成</button>
      </div>
    </div>
  </div>

  <div class="semester-navigation">

    <button
      id="previousSemesterButton"
      onclick="previousSemester()"
    >
      ← 前の学期へ
    </button>

    <button
      id="nextSemesterButton"
      onclick="nextSemester()"
    >
      次の学期へ →
    </button>

  </div>


<script>

  const DAYS = [
    "月",
    "火",
    "水",
    "木",
    "金",
    "土"
  ];

  const PERIODS = 5;

  const LAST_SEMESTER = 7;


  /*
   * 学期データ
   *
   * 2学期制：
   * semesters[0] = 1年1学期
   * semesters[1] = 1年2学期
   * semesters[2] = 2年1学期
   * semesters[3] = 2年2学期
   */

  /*
   * 学期ごとの記録。
   * 同じ学期をやり直した場合も、別レコードとして保存する。
   * 旧バージョンのデータは初回起動時に引き継ぐ。
   */

  let semesterRecords = JSON.parse(
    localStorage.getItem("absenceCounterSemesterRecords")
  );

  let currentRecordIndex = parseInt(
    localStorage.getItem("absenceCounterCurrentRecordIndex"),
    10
  );

  if (!Array.isArray(semesterRecords) || semesterRecords.length === 0) {
    const oldSemesters = JSON.parse(
      localStorage.getItem("absenceCounterSemesters")
    ) || [{}];

    let oldCurrentSemester = parseInt(
      localStorage.getItem("absenceCounterCurrentSemester"),
      10
    );

    if (isNaN(oldCurrentSemester) || oldCurrentSemester < 0) {
      oldCurrentSemester = 0;
    }
    oldCurrentSemester = Math.min(oldCurrentSemester, LAST_SEMESTER);

    semesterRecords = oldSemesters.map((data, index) => ({
      semester: Math.min(index, LAST_SEMESTER),
      data: data || {}
    }));

    while (semesterRecords.length <= oldCurrentSemester) {
      semesterRecords.push({ semester: semesterRecords.length, data: {} });
    }

    currentRecordIndex = oldCurrentSemester;
  }

  if (!Number.isInteger(currentRecordIndex) ||
      currentRecordIndex < 0 ||
      currentRecordIndex >= semesterRecords.length) {
    currentRecordIndex = Math.max(0, semesterRecords.length - 1);
  }


  /*
   * 現在選択されているセル
   *
   * 例：
   * "0-0" = 月曜1限
   * "1-2" = 火曜3限
   */

  let selectedKey = null;


  const schedule =
    document.getElementById(
      "schedule"
    );

  const increaseButton =
    document.getElementById(
      "increaseButton"
    );

  const decreaseButton =
    document.getElementById(
      "decreaseButton"
    );

  const previousSemesterButton =
    document.getElementById(
      "previousSemesterButton"
    );

  const nextSemesterButton =
    document.getElementById(
      "nextSemesterButton"
    );

  const semesterDialogBackdrop =
    document.getElementById("semesterDialogBackdrop");

  const targetSemesterSelect =
    document.getElementById("targetSemesterSelect");

  const semesterHistoryList =
    document.getElementById("semesterHistoryList");



  /*
   * 現在の学期のデータを取得
   */

  function getCurrentRecord() {
    return semesterRecords[currentRecordIndex];
  }

  function getCurrentSemester() {
    return getCurrentRecord().semester;
  }

  function getCurrentData() {
    const record = getCurrentRecord();
    if (!record.data) record.data = {};
    return record.data;
  }


  /*
   * 表を作成
   *
   * IMPORTANT:
   * ここでは selectedKey を
   * null にしない。
   *
   * これによって、
   * セルを選択した後に＋1・−1を
   * 使用できる。
   */

  function createTable() {

    schedule.innerHTML = "";


    const data =
      getCurrentData();





    for (
      let period = 0;
      period < PERIODS;
      period++
    ) {

      const tr =
        document.createElement(
          "tr"
        );


      const periodCell =
        document.createElement(
          "th"
        );

      periodCell.textContent =
        period + 1;

      tr.appendChild(
        periodCell
      );


      for (
        let day = 0;
        day < DAYS.length;
        day++
      ) {

        const td =
          document.createElement(
            "td"
          );


        const key =
          `${day}-${period}`;


        updateCell(
          td,
          key,
          data
        );


        setupEvents(
          td,
          key
        );


        tr.appendChild(td);

      }


      schedule.appendChild(tr);

    }


    updateButtons();

    updatePreviousButton();

    renderSemesterHistory();

  }


  /* 追加済みの学期を一覧表示し、現在の記録を強調する。 */
  function renderSemesterHistory() {
    semesterHistoryList.innerHTML = "";
    const seen = {};
    semesterRecords.forEach((record, index) => {
      const semester = Math.max(0, Math.min(record.semester, LAST_SEMESTER));
      const year = Math.floor(semester / 2) + 1;
      const term = semester % 2 + 1;
      const key = String(semester);
      seen[key] = (seen[key] || 0) + 1;
      const item = document.createElement("div");
      item.className = "semester-history-item";
      if (index === currentRecordIndex) item.classList.add("current");
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "semester-chip";
      chip.textContent = year + "-" + term + (seen[key] > 1 ? " (" + seen[key] + ")" : "");
      chip.setAttribute("aria-label", year + "年" + term + "学期" + (seen[key] > 1 ? "、" + seen[key] + "回目の記録" : "") + (index === currentRecordIndex ? "、現在表示中" : ""));
      if (index === currentRecordIndex) chip.setAttribute("aria-current", "page");
      chip.addEventListener("click", () => {
        currentRecordIndex = index;
        selectedKey = null;
        save();
        createTable();
      });
      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.className = "semester-delete";
      deleteButton.textContent = "×";
      deleteButton.setAttribute("aria-label", year + "年" + term + "学期の記録を削除");
      deleteButton.addEventListener("click", () => deleteSemesterRecord(index, year, term, seen[key]));
      item.appendChild(chip);
      item.appendChild(deleteButton);
      semesterHistoryList.appendChild(item);
    });
  }

  function deleteSemesterRecord(index, year, term, attemptNumber) {
    if (semesterRecords.length <= 1) {
      alert("最後の1つの学期は削除できません。");
      return;
    }
    const attemptText = attemptNumber > 1 ? "（" + attemptNumber + "回目の記録）" : "";
    const confirmed = confirm(year + "年" + term + "学期" + attemptText + "の表と欠席データを削除する？\nこの操作は取り消せません。");
    if (!confirmed) return;
    semesterRecords.splice(index, 1);
    if (index < currentRecordIndex) {
      currentRecordIndex--;
    } else if (index === currentRecordIndex) {
      currentRecordIndex = Math.min(index, semesterRecords.length - 1);
    }
    selectedKey = null;
    save();
    createTable();
  }


  /*
   * セルの表示
   */

  function updateCell(
    td,
    key,
    data
  ) {

    const item =
      data[key];


    td.className = "";


    /*
     * 授業なし
     */

    if (
      !item ||
      !item.exists
    ) {

      td.classList.add(
        "empty"
      );

      td.textContent = "";

      /*
       * 授業なしでも、
       * 選択されていることが
       * 分かるようにする。
       */

      if (
        key === selectedKey
      ) {

        td.classList.add(
          "selected"
        );

      }

      return;
    }


    /*
     * 選択中
     */

    if (
      key === selectedKey
    ) {

      td.classList.add(
        "selected"
      );

    }


    /*
     * 欠席0回
     */

    if (
      item.count === 0
    ) {

      td.textContent = "－";

      td.classList.add(
        "blue"
      );

      return;
    }


    /*
     * 欠席回数
     */

    td.textContent =
      item.count;


    /*
     * 上限なし
     */

    if (
      item.max === null
    ) {

      td.classList.add(
        "blue"
      );

      return;
    }


    /*
     * 上限到達
     */

    if (
      item.count >= item.max
    ) {

      td.classList.add(
        "danger"
      );

      return;
    }


    /*
     * 上限の1回前
     *
     * 例：
     * 上限3 → 2が黄色
     * 上限5 → 4が黄色
     */

    if (
      item.count ===
      item.max - 1
    ) {

      td.classList.add(
        "yellow"
      );

      return;
    }


    /*
     * それ以外
     */

    td.classList.add(
      "green"
    );

  }


  /*
   * セルの操作
   */

  function setupEvents(
    td,
    key
  ) {

    let pressTimer = null;

    let longPress = false;


    /*
     * 押し始め
     */

    td.addEventListener(
      "pointerdown",
      () => {

        longPress = false;


        pressTimer =
          setTimeout(
            () => {

              longPress = true;

              setMax(key);

            },
            600
          );

      }
    );


    /*
     * 指を離す
     */

    td.addEventListener(
      "pointerup",
      () => {

        clearTimeout(
          pressTimer
        );

      }
    );


    /*
     * セルから指が離れた場合
     */

    td.addEventListener(
      "pointerleave",
      () => {

        clearTimeout(
          pressTimer
        );

      }
    );


    /*
     * 通常タップ
     *
     * カウントは変更せず、
     * セルを選択するだけ。
     */

    td.addEventListener(
      "click",
      () => {


        /*
         * 長押し直後のクリックを
         * 完全に無視する。
         *
         * これによって
         *
         * 長押し
         * ↓
         * 上限入力
         * ↓
         * ＋1される
         *
         * という問題を防ぐ。
         */

        if (
          longPress
        ) {

          longPress = false;

          return;

        }


        selectedKey = key;


        createTable();

      }
    );

  }


  /*
   * ＋1
   */

  function increaseSelected() {

    if (
      selectedKey === null
    ) {

      return;

    }


    const data =
      getCurrentData();


    /*
     * 授業なし
     *
     * ＋1ボタンを押した場合、
     * 授業を登録する。
     *
     * ただし最初は0回なので
     * 表示は「－」。
     */

    if (
      !data[selectedKey]
    ) {

      data[selectedKey] = {

        exists: true,

        count: 0,

        max: 4

      };


      save();

      createTable();

      return;

    }


    const item =
      data[selectedKey];


    /*
     * 上限0
     */

    if (
      item.max !== null &&
      item.max <= 0
    ) {

      return;

    }


    /*
     * 上限到達
     */

    if (
      item.max !== null &&
      item.count >= item.max
    ) {

      return;

    }


    /*
     * カウントアップ
     */

    item.count++;


    save();

    createTable();

  }


  /*
   * −1
   */

  function decreaseSelected() {

    if (
      selectedKey === null
    ) {

      return;

    }


    const data =
      getCurrentData();


    const item =
      data[selectedKey];


    /*
     * 授業なし
     */

    if (
      !item ||
      !item.exists
    ) {

      return;

    }


    /*
     * 1以上なら−1
     */

    if (
      item.count > 0
    ) {

      item.count--;

    }

    /*
     * 0から−1
     * → 授業なし
     */

    else {

      delete data[
        selectedKey
      ];

    }


    save();

    createTable();

  }


  /*
   * 欠席上限を設定
   */

  function setMax(key) {

    const data =
      getCurrentData();


    /*
     * もともと授業があったか
     * 記録しておく。
     *
     * キャンセルした場合に、
     * 長押しによって勝手に
     * 授業が作られないようにする。
     */

    const originallyExists =
      !!data[key];


    /*
     * 授業なしの場合、
     * 長押しで授業を作る。
     */

    if (
      !data[key]
    ) {

      data[key] = {

        exists: true,

        count: 0,

        max: 4

      };

    }


    const current =
      data[key].max;


    const answer =
      prompt(

        "欠席できる最大回数を入力してください。\n" +
        "空欄にすると上限なし。",

        current === null
          ? ""
          : current

      );


    /*
     * キャンセル
     */

    if (
      answer === null
    ) {

      /*
       * もともと授業がなかった場合は、
       * 長押し前の状態に戻す。
       */

      if (
        !originallyExists
      ) {

        delete data[key];

      }


      return;

    }


    /*
     * 空欄
     * → 上限なし
     */

    if (
      answer.trim() === ""
    ) {

      data[key].max = null;

    }

    else {

      const max =
        parseInt(
          answer,
          10
        );


      /*
       * 不正な入力
       */

      if (
        isNaN(max) ||
        max < 0
      ) {

        alert(
          "0以上の数字を入力してください。"
        );

        /*
         * 新しく作った授業なら
         * 元に戻す。
         */

        if (
          !originallyExists
        ) {

          delete data[key];

        }

        return;

      }


      data[key].max = max;


      /*
       * 現在の欠席回数が
       * 上限を超えていた場合、
       * 上限まで下げる。
       */

      if (
        data[key].count > max
      ) {

        data[key].count = max;

      }

    }


    save();

    createTable();

  }


  /*
   * 「次の学期へ」を押したら、移動先を選ぶ画面を開く。
   */

  function nextSemester() {
    const suggestedSemester = Math.min(
      getCurrentSemester() + 1,
      LAST_SEMESTER
    );
    targetSemesterSelect.value = String(suggestedSemester);
    semesterDialogBackdrop.classList.add("open");
  }

  function closeSemesterDialog() {
    semesterDialogBackdrop.classList.remove("open");
  }

  /*
   * 選択した学期の新しい表を作成する。
   * 同じ学期を選んでも、過去の表は上書きしない。
   */

  function confirmNextSemester() {
    const targetSemester = parseInt(targetSemesterSelect.value, 10);

    if (isNaN(targetSemester) ||
        targetSemester < 0 ||
        targetSemester > LAST_SEMESTER) {
      return;
    }

    semesterRecords.push({
      semester: targetSemester,
      data: {}
    });
    currentRecordIndex = semesterRecords.length - 1;
    selectedKey = null;
    save();
    closeSemesterDialog();
    createTable();
  }


  /*
   * 前の記録へ戻る（同じ学期を複数回表示できる）。
   */

  function previousSemester() {
    if (currentRecordIndex <= 0) return;

    currentRecordIndex--;
    selectedKey = null;
    save();
    createTable();
  }


  /*
   * ＋1 / −1ボタンの状態
   */

  function updateButtons() {

    const data =
      getCurrentData();


    /*
     * セル未選択
     */

    if (
      selectedKey === null
    ) {

      increaseButton.disabled =
        true;

      decreaseButton.disabled =
        true;

      return;

    }


    const item =
      data[selectedKey];


    /*
     * 授業なし
     *
     * ＋1 → 使用可能
     * −1 → 使用不可
     */

    if (
      !item ||
      !item.exists
    ) {

      increaseButton.disabled =
        false;

      decreaseButton.disabled =
        true;

      return;

    }


    /*
     * ＋1
     *
     * 上限に達していれば
     * 無効。
     */

    increaseButton.disabled =
      item.max !== null &&
      item.count >= item.max;


    /*
     * −1
     *
     * 授業が存在すれば使用可能。
     */

    decreaseButton.disabled =
      false;

  }


  /*
   * 前の学期ボタン
   */

  function updatePreviousButton() {

    const atFirstRecord = currentRecordIndex === 0;
    previousSemesterButton.disabled = atFirstRecord;
    previousSemesterButton.classList.toggle("hidden", atFirstRecord);
    nextSemesterButton.disabled = false;
  }


  /*
   * 保存
   */

  function save() {
    localStorage.setItem(
      "absenceCounterSemesterRecords",
      JSON.stringify(semesterRecords)
    );
    localStorage.setItem(
      "absenceCounterCurrentRecordIndex",
      String(currentRecordIndex)
    );
  }


  /*
   * 初期表示
   */

  createTable();

</script>

</body>
</html>
