<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>欠席カウンター</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 12px;
    }

    h1 {
      font-size: 22px;
      text-align: center;
      margin: 10px 0 20px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 4px;
      table-layout: fixed;
    }

    th {
      height: 42px;
      font-size: 14px;
      font-weight: 500;
    }

    th:first-child {
      width: 42px;
    }

    td {
      height: 72px;
      text-align: center;
      vertical-align: middle;
      background: white;
      border-radius: 8px;
      font-size: 26px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.08s, background-color 0.15s;
    }

    td:active {
      transform: scale(0.96);
    }

    td.empty {
      background: #e9e9e9;
      color: transparent;
    }

    /* 欠席0回 */
    td.zero {
      background: #e4f3e4;
    }

    /* 上限まで残り1回 */
    td.warning {
      background: #fff3c4;
    }

    /* 上限到達 */
    td.danger {
      background: #ffdede;
    }

    .help {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #888;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>欠席カウンター</h1>

    <table>
      <thead>
        <tr>
          <th></th>
          <th>月</th>
          <th>火</th>
          <th>水</th>
          <th>木</th>
          <th>金</th>
          <th>土</th>
        </tr>
      </thead>

      <tbody id="schedule"></tbody>
    </table>

    <div class="help">
      タップ：欠席＋1　／　ダブルタップ：−1<br>
      長押し：欠席上限を設定
    </div>

  </div>

<script>

  const DAYS = ["月", "火", "水", "木", "金", "土"];
  const PERIODS = 5;

  /*
    データ構造

    {
      "0-0": {
        exists: true,
        count: 1,
        max: 3
      }
    }

    0-0 = 月曜1限
    0-1 = 火曜1限
    1-0 = 月曜2限
    ...
  */

  let data = JSON.parse(
    localStorage.getItem("absenceCounter")
  ) || {};

  const schedule = document.getElementById("schedule");

  // -------------------------
  // 表を作る
  // -------------------------

  function createTable() {

    schedule.innerHTML = "";

    for (let period = 0; period < PERIODS; period++) {

      const tr = document.createElement("tr");

      // 時限
      const periodCell = document.createElement("th");
      periodCell.textContent = period + 1;
      tr.appendChild(periodCell);

      // 曜日
      for (let day = 0; day < DAYS.length; day++) {

        const td = document.createElement("td");

        const key = `${day}-${period}`;

        updateCell(td, key);

        setupEvents(td, key);

        tr.appendChild(td);
      }

      schedule.appendChild(tr);
    }
  }


  // -------------------------
  // セルの表示
  // -------------------------

  function updateCell(td, key) {

    const item = data[key];

    td.className = "";

    if (!item || !item.exists) {
      td.classList.add("empty");
      td.textContent = "";
      return;
    }

    td.textContent = item.count;

    // 欠席0回
    if (item.count === 0) {
      td.classList.add("zero");
    }

    // 上限まで残り1回
    else if (item.max !== null &&
             item.max - item.count === 1) {
      td.classList.add("warning");
    }

    // 上限到達
    else if (item.max !== null &&
             item.count >= item.max) {
      td.classList.add("danger");
    }
  }


  // -------------------------
  // タップ・ダブルタップ・長押し
  // -------------------------

  function setupEvents(td, key) {

    let pressTimer = null;
    let longPress = false;
    let clickTimer = null;

    // タップ開始
    td.addEventListener("pointerdown", () => {

      longPress = false;

      pressTimer = setTimeout(() => {

        longPress = true;

        setMax(key);

      }, 600);

    });


    // タップ終了
    td.addEventListener("pointerup", () => {

      clearTimeout(pressTimer);

    });


    td.addEventListener("pointerleave", () => {

      clearTimeout(pressTimer);

    });


    // タップ
    td.addEventListener("click", () => {

      if (longPress) {
        return;
      }

      /*
        すぐに処理せず、
        ダブルタップかどうかを少し待つ
      */

      if (clickTimer !== null) {

        // ダブルタップ
        clearTimeout(clickTimer);
        clickTimer = null;

        decrease(key);

      } else {

        clickTimer = setTimeout(() => {

          clickTimer = null;

          increase(key);

        }, 250);

      }

    });
  }


  // -------------------------
  // 欠席＋1
  // -------------------------

  function increase(key) {

    // 授業がなければ追加
    if (!data[key]) {

      data[key] = {
        exists: true,
        count: 0,
        max: null
      };

    }

    const item = data[key];

    // 上限が設定されていて到達している
    if (item.max !== null &&
        item.count >= item.max) {

      return;
    }

    item.count++;

    save();
    createTable();
  }


  // -------------------------
  // 欠席−1
  // -------------------------

  function decrease(key) {

    const item = data[key];

    if (!item || !item.exists) {
      return;
    }

    if (item.count > 0) {

      item.count--;

    } else {

      // 0でダブルタップすると授業を削除
      delete data[key];

    }

    save();
    createTable();
  }


  // -------------------------
  // 欠席上限設定
  // -------------------------

  function setMax(key) {

    /*
      授業がなければ、
      長押しで授業を追加する
    */

    if (!data[key]) {

      data[key] = {
        exists: true,
        count: 0,
        max: null
      };
    }

    const current = data[key].max;

    const answer = prompt(
      "欠席できる最大回数を入力してください。\n" +
      "空欄にすると上限なし。",
      current === null ? "" : current
    );

    // キャンセル
    if (answer === null) {
      return;
    }

    // 空欄 → 上限なし
    if (answer.trim() === "") {

      data[key].max = null;

    } else {

      const max = parseInt(answer, 10);

      if (isNaN(max) || max < 0) {

        alert("0以上の数字を入力してください。");
        return;

      }

      data[key].max = max;

      // 上限を下げた場合
      if (data[key].count > max) {
        data[key].count = max;
      }
    }

    save();
    createTable();
  }


  // -------------------------
  // 保存
  // -------------------------

  function save() {

    localStorage.setItem(
      "absenceCounter",
      JSON.stringify(data)
    );

  }


  // 初期表示
  createTable();

</script>

</body>
</html>
