<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>欠席カウンター</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 12px;
      min-height: 100vh;
      position: relative;
      padding-bottom: 90px;
    }

    h1 {
      font-size: 22px;
      text-align: center;
      margin: 10px 0 20px;
      font-weight: 600;
    }

    .semester {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-top: -10px;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 4px;
      table-layout: fixed;
    }

    th {
      height: 42px;
      font-size: 14px;
      font-weight: 500;
    }

    th:first-child {
      width: 42px;
    }

    td {
      height: 72px;
      text-align: center;
      vertical-align: middle;

      border-radius: 8px;

      font-size: 26px;
      font-weight: 500;

      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;

      border: 2px solid transparent;

      transition:
        transform 0.08s,
        background-color 0.15s,
        border-color 0.15s;
    }

    td:active {
      transform: scale(0.96);
    }

    /* 選択中 */
    td.selected {
      border-color: #555;
    }

    /* 授業なし */
    td.empty {
      background: #e9e9e9;
      color: transparent;
    }

    /* 0回 */
    td.blue {
      background: #dceeff;
      color: #2674c9;
    }

    /* 安全圏 */
    td.green {
      background: #e1f3e1;
      color: #31833b;
    }

    /* 上限-1 */
    td.yellow {
      background: #fff3c4;
      color: #8a6d00;
    }

    /* 上限到達 */
    td.danger {
      background: #ffdede;
      color: #d33;
    }

    /* カウントボタン */
    .counter-buttons {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    .counter-buttons button {
      flex: 1;
      height: 52px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      background: #e5e5e5;
      color: #333;
    }

    .counter-buttons button:active {
      transform: scale(0.97);
    }

    .counter-buttons button:disabled {
      opacity: 0.4;
    }

    .help {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #888;
      line-height: 1.8;
    }

    /* 学期移動 */
    .semester-navigation {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12px;

      max-width: 700px;
      margin: 0 auto;

      padding: 0 16px;

      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .semester-navigation button {
      pointer-events: auto;

      border: none;
      background: #ddd;
      color: #444;

      padding: 10px 14px;
      border-radius: 8px;

      font-size: 13px;
      cursor: pointer;
    }

    .semester-navigation button:active {
      transform: scale(0.97);
    }

    .semester-navigation .hidden {
      visibility: hidden;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>欠席カウンター</h1>

    <div class="semester" id="semesterLabel">
      1学期
    </div>

    <table>
      <thead>
        <tr>
          <th></th>
          <th>月</th>
          <th>火</th>
          <th>水</th>
          <th>木</th>
          <th>金</th>
          <th>土</th>
        </tr>
      </thead>

      <tbody id="schedule"></tbody>
    </table>

    <div class="counter-buttons">

      <button
        id="decreaseButton"
        onclick="decreaseSelected()"
      >
        −1
      </button>

      <button
        id="increaseButton"
        onclick="increaseSelected()"
      >
        ＋1
      </button>

    </div>

    <div class="help">
      セルを選択して欠席回数を変更できます<br>
      長押し：欠席上限を設定
    </div>

  </div>

  <div class="semester-navigation">

    <button
      id="previousSemesterButton"
      onclick="previousSemester()"
    >
      ← 前の学期へ
    </button>

    <button
      onclick="nextSemester()"
    >
      次の学期へ →
    </button>

  </div>


<script>

  const DAYS = ["月", "火", "水", "木", "金", "土"];
  const PERIODS = 5;

  /*
   * 学期データ
   *
   * semesters[0] = 1学期
   * semesters[1] = 2学期
   * semesters[2] = 3学期...
   */

  let semesters =
    JSON.parse(
      localStorage.getItem("absenceCounterSemesters")
    ) || [
      {}
    ];

  let currentSemester =
    parseInt(
      localStorage.getItem("absenceCounterCurrentSemester"),
      10
    );

  if (
    isNaN(currentSemester) ||
    currentSemester < 0
  ) {
    currentSemester = 0;
  }

  /*
   * 現在選択されているセル
   */
  let selectedKey = null;


  const schedule =
    document.getElementById("schedule");

  const semesterLabel =
    document.getElementById("semesterLabel");

  const increaseButton =
    document.getElementById("increaseButton");

  const decreaseButton =
    document.getElementById("decreaseButton");

  const previousSemesterButton =
    document.getElementById(
      "previousSemesterButton"
    );


  /*
   * 現在の学期のデータ
   */
  function getCurrentData() {

    if (!semesters[currentSemester]) {
      semesters[currentSemester] = {};
    }

    return semesters[currentSemester];
  }


  /*
   * 表を作成
   */
  function createTable() {

    schedule.innerHTML = "";

    selectedKey = null;

    const data = getCurrentData();

    semesterLabel.textContent =
      `${currentSemester + 1}学期`;


    for (
      let period = 0;
      period < PERIODS;
      period++
    ) {

      const tr =
        document.createElement("tr");


      const periodCell =
        document.createElement("th");

      periodCell.textContent =
        period + 1;

      tr.appendChild(periodCell);


      for (
        let day = 0;
        day < DAYS.length;
        day++
      ) {

        const td =
          document.createElement("td");

        const key =
          `${day}-${period}`;


        updateCell(
          td,
          key,
          data
        );


        setupEvents(
          td,
          key
        );


        tr.appendChild(td);
      }


      schedule.appendChild(tr);
    }


    updateButtons();

    updatePreviousButton();
  }


  /*
   * セルの表示
   */
  function updateCell(
    td,
    key,
    data
  ) {

    const item = data[key];

    td.className = "";


    /*
     * 授業なし
     */
    if (
      !item ||
      !item.exists
    ) {

      td.classList.add("empty");

      td.textContent = "";

      return;
    }


    /*
     * 選択中のセル
     */
    if (
      key === selectedKey
    ) {

      td.classList.add(
        "selected"
      );
    }


    /*
     * 欠席0回
     */
    if (
      item.count === 0
    ) {

      td.textContent = "－";

      td.classList.add("blue");

      return;
    }


    td.textContent =
      item.count;


    /*
     * 上限なし
     */
    if (
      item.max === null
    ) {

      td.classList.add("blue");

      return;
    }


    /*
     * 上限到達
     */
    if (
      item.count >= item.max
    ) {

      td.classList.add(
        "danger"
      );

      return;
    }


    /*
     * 上限の1回前
     */
    if (
      item.count === item.max - 1
    ) {

      td.classList.add(
        "yellow"
      );

      return;
    }


    /*
     * それ以外
     */
    td.classList.add("green");
  }


  /*
   * セルの操作
   */
  function setupEvents(
    td,
    key
  ) {

    let pressTimer = null;

    let longPress = false;


    /*
     * 押し始め
     */
    td.addEventListener(
      "pointerdown",
      () => {

        longPress = false;


        pressTimer =
          setTimeout(() => {

            longPress = true;

            setMax(key);

          }, 600);

      }
    );


    /*
     * 指を離す
     */
    td.addEventListener(
      "pointerup",
      () => {

        clearTimeout(
          pressTimer
        );

      }
    );


    /*
     * 指がセルから離れた
     */
    td.addEventListener(
      "pointerleave",
      () => {

        clearTimeout(
          pressTimer
        );

      }
    );


    /*
     * 通常タップ
     *
     * 今回は欠席回数を変更せず、
     * セルを選択するだけ。
     */
    td.addEventListener(
      "click",
      () => {

        /*
         * 長押し直後のクリックは
         * 完全に無視する。
         *
         * これで
         * 「上限を入力したら＋1される」
         * 問題を防止。
         */
        if (longPress) {

          longPress = false;

          return;
        }


        selectedKey = key;

        createTable();

      }
    );
  }


  /*
   * 選択セルを＋1
   */
  function increaseSelected() {

    if (
      selectedKey === null
    ) {

      return;
    }


    const data =
      getCurrentData();


    /*
     * 授業なし
     *
     * ＋1を押したら
     * 授業あり・欠席0回になる。
     */
    if (
      !data[selectedKey]
    ) {

      data[selectedKey] = {
        exists: true,
        count: 0,
        max: null
      };

      save();

      createTable();

      return;
    }


    const item =
      data[selectedKey];


    /*
     * 上限0の場合
     */
    if (
      item.max !== null &&
      item.max <= 0
    ) {

      return;
    }


    /*
     * 上限に到達している場合
     */
    if (
      item.max !== null &&
      item.count >= item.max
    ) {

      return;
    }


    item.count++;


    save();

    createTable();
  }


  /*
   * 選択セルを−1
   */
  function decreaseSelected() {

    if (
      selectedKey === null
    ) {

      return;
    }


    const data =
      getCurrentData();


    const item =
      data[selectedKey];


    /*
     * 授業なし
     */
    if (
      !item ||
      !item.exists
    ) {

      return;
    }


    /*
     * 欠席回数が1以上
     */
    if (
      item.count > 0
    ) {

      item.count--;

    } else {

      /*
       * 0回から−1
       * → 授業なしに戻す
       */
      delete data[selectedKey];

    }


    save();

    createTable();
  }


  /*
   * 欠席上限設定
   */
  function setMax(key) {

    const data =
      getCurrentData();


    /*
     * 授業なしなら授業を作る
     */
    if (
      !data[key]
    ) {

      data[key] = {
        exists: true,
        count: 0,
        max: null
      };

    }


    const current =
      data[key].max;


    const answer =
      prompt(
        "欠席できる最大回数を入力してください。\n" +
        "空欄にすると上限なし。",
        current === null
          ? ""
          : current
      );


    /*
     * キャンセル
     */
    if (
      answer === null
    ) {

      /*
       * 長押しで新しく作った
       * 授業だった場合、
       * キャンセルなら元に戻す。
       */
      if (
        data[key].count === 0 &&
        data[key].max === null
      ) {

        /*
         * もともと存在していたかは
         * 判別できるようにするため、
         * 長押し開始前の情報を使う
         * 必要がある。
         *
         * 今回はキャンセル時には
         * 授業を残す。
         */
      }

      return;
    }


    /*
     * 空欄
     * → 上限なし
     */
    if (
      answer.trim() === ""
    ) {

      data[key].max = null;

    } else {

      const max =
        parseInt(
          answer,
          10
        );


      if (
        isNaN(max) ||
        max < 0
      ) {

        alert(
          "0以上の数字を入力してください。"
        );

        return;
      }


      data[key].max = max;


      /*
       * 現在の欠席数が上限を
       * 超えないようにする
       */
      if (
        data[key].count > max
      ) {

        data[key].count = max;

      }
    }


    save();

    createTable();
  }


  /*
   * 次の学期へ
   */
  function nextSemester() {

    currentSemester++;


    /*
     * まだ存在しない学期なら
     * 空の表を作る。
     */
    if (
      !semesters[currentSemester]
    ) {

      semesters[currentSemester] = {};

    }


    selectedKey = null;


    save();


    localStorage.setItem(
      "absenceCounterCurrentSemester",
      currentSemester
    );


    createTable();
  }


  /*
   * 前の学期へ
   */
  function previousSemester() {

    /*
     * 1学期より前には戻れない
     */
    if (
      currentSemester <= 0
    ) {

      return;
    }


    currentSemester--;


    selectedKey = null;


    save();


    localStorage.setItem(
      "absenceCounterCurrentSemester",
      currentSemester
    );


    createTable();
  }


  /*
   * ＋1 / −1ボタンの状態
   */
  function updateButtons() {

    const data =
      getCurrentData();


    /*
     * セル未選択
     */
    if (
      selectedKey === null
    ) {

      increaseButton.disabled = true;

      decreaseButton.disabled = true;

      return;
    }


    const item =
      data[selectedKey];


    /*
     * 授業なし
     *
     * ＋1は可能
     * −1は不可
     */
    if (
      !item ||
      !item.exists
    ) {

      increaseButton.disabled = false;

      decreaseButton.disabled = true;

      return;
    }


    /*
     * ＋1
     */
    increaseButton.disabled =
      item.max !== null &&
      item.count >= item.max;


    /*
     * −1
     */
    decreaseButton.disabled = false;
  }


  /*
   * 前の学期ボタン表示
   */
  function updatePreviousButton() {

    if (
      currentSemester === 0
    ) {

      previousSemesterButton.classList.add(
        "hidden"
      );

    } else {

      previousSemesterButton.classList.remove(
        "hidden"
      );

    }
  }


  /*
   * 保存
   */
  function save() {

    localStorage.setItem(
      "absenceCounterSemesters",
      JSON.stringify(semesters)
    );


    localStorage.setItem(
      "absenceCounterCurrentSemester",
      currentSemester
    );
  }


  /*
   * 初期表示
   */
  createTable();

</script>

</body>
</html>
