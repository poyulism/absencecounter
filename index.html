<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>欠席カウンター</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 12px;
    }

    h1 {
      font-size: 22px;
      text-align: center;
      margin: 10px 0 20px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 4px;
      table-layout: fixed;
    }

    th {
      height: 42px;
      font-size: 14px;
      font-weight: 500;
    }

    th:first-child {
      width: 42px;
    }

    td {
      height: 72px;
      text-align: center;
      vertical-align: middle;

      border-radius: 8px;

      font-size: 26px;
      font-weight: 500;

      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;

      transition:
        transform 0.08s,
        background-color 0.15s;
    }

    td:active {
      transform: scale(0.96);
    }


    /* =========================
       授業なし
       ========================= */

    td.empty {
      background: #e9e9e9;
      color: transparent;
    }


    /* =========================
       青
       授業あり・欠席0回
       上限なし
       ========================= */

    td.blue {
      background: #dceeff;
      color: #2674c9;
    }


    /* =========================
       緑
       欠席1回以上
       上限まで余裕あり
       ========================= */

    td.green {
      background: #e1f3e1;
      color: #31833b;
    }


    /* =========================
       赤
       欠席上限到達
       ========================= */

    td.danger {
      background: #ffdede;
      color: #d33;
    }


    /* =========================
       操作説明
       ========================= */

    .help {
      margin-top: 18px;

      text-align: center;

      font-size: 12px;
      color: #888;

      line-height: 1.8;
    }

  </style>
</head>


<body>

  <div class="container">

    <h1>欠席カウンター</h1>


    <table>

      <thead>

        <tr>
          <th></th>

          <th>月</th>
          <th>火</th>
          <th>水</th>
          <th>木</th>
          <th>金</th>
          <th>土</th>
        </tr>

      </thead>


      <tbody id="schedule"></tbody>

    </table>


    <div class="help">
      タップ：＋1　／　ダブルタップ：−1<br>
      長押し：欠席上限を設定
    </div>

  </div>


<script>

  // =========================
  // 基本設定
  // =========================

  const DAYS = ["月", "火", "水", "木", "金", "土"];

  const PERIODS = 5;


  // =========================
  // データ読み込み
  // =========================

  let data = JSON.parse(
    localStorage.getItem("absenceCounter")
  ) || {};


  const schedule =
    document.getElementById("schedule");


  // =========================
  // 表を作成
  // =========================

  function createTable() {

    schedule.innerHTML = "";


    for (
      let period = 0;
      period < PERIODS;
      period++
    ) {

      const tr =
        document.createElement("tr");


      // 時限
      const periodCell =
        document.createElement("th");

      periodCell.textContent =
        period + 1;

      tr.appendChild(periodCell);


      // 曜日
      for (
        let day = 0;
        day < DAYS.length;
        day++
      ) {

        const td =
          document.createElement("td");


        const key =
          `${day}-${period}`;


        updateCell(td, key);

        setupEvents(td, key);


        tr.appendChild(td);
      }


      schedule.appendChild(tr);
    }
  }


  // =========================
  // セルの表示
  // =========================

  function updateCell(td, key) {

    const item = data[key];


    // 一度クラスをリセット
    td.className = "";


    // -------------------------
    // 授業なし
    // -------------------------

    if (
      !item ||
      !item.exists
    ) {

      td.classList.add("empty");

      // 授業なしは完全に空欄
      td.textContent = "";

      return;
    }


    // -------------------------
    // 欠席0回
    // -------------------------

    if (
      item.count === 0
    ) {

      // 0ではなく「－」
      td.textContent = "－";

      // 青
      td.classList.add("blue");

      return;
    }


    // -------------------------
    // 欠席1回以上
    // -------------------------

    td.textContent =
      item.count;


    // -------------------------
    // 上限到達
    // -------------------------

    if (
      item.max !== null &&
      item.count >= item.max
    ) {

      td.classList.add("danger");

      return;
    }


    // -------------------------
    // 上限あり・まだ余裕あり
    // -------------------------

    if (
      item.max !== null &&
      item.count < item.max
    ) {

      td.classList.add("green");

      return;
    }


    // -------------------------
    // 上限なし
    // -------------------------

    td.classList.add("blue");
  }


  // =========================
  // 操作イベント
  // =========================

  function setupEvents(td, key) {

    let pressTimer = null;

    let longPress = false;

    let clickTimer = null;


    // -------------------------
    // 指を押した
    // -------------------------

    td.addEventListener(
      "pointerdown",
      () => {

        longPress = false;


        pressTimer =
          setTimeout(() => {

            longPress = true;

            setMax(key);

          }, 600);

      }
    );


    // -------------------------
    // 指を離した
    // -------------------------

    td.addEventListener(
      "pointerup",
      () => {

        clearTimeout(
          pressTimer
        );

      }
    );


    // -------------------------
    // セルから指が離れた
    // -------------------------

    td.addEventListener(
      "pointerleave",
      () => {

        clearTimeout(
          pressTimer
        );

      }
    );


    // -------------------------
    // タップ
    // -------------------------

    td.addEventListener(
      "click",
      () => {

        // 長押しだった場合
        // 通常のタップ処理をしない
        if (longPress) {
          return;
        }


        // ---------------------
        // ダブルタップ
        // ---------------------

        if (
          clickTimer !== null
        ) {

          clearTimeout(
            clickTimer
          );

          clickTimer = null;


          decrease(key);

          return;
        }


        // ---------------------
        // 1回目のタップ
        // ---------------------

        clickTimer =
          setTimeout(() => {

            clickTimer = null;

            increase(key);

          }, 250);

      }
    );
  }


  // =========================
  // タップ
  // 欠席＋1
  // =========================

  function increase(key) {

    // -------------------------
    // 授業なし
    // -------------------------

    if (!data[key]) {

      // 授業を追加する
      // 欠席回数は0
      data[key] = {

        exists: true,

        count: 0,

        max: null

      };


      save();

      createTable();

      return;
    }


    const item =
      data[key];


    // -------------------------
    // 上限到達済み
    // -------------------------

    if (
      item.max !== null &&
      item.count >= item.max
    ) {

      return;
    }


    // -------------------------
    // 欠席＋1
    // -------------------------

    item.count++;


    save();

    createTable();
  }


  // =========================
  // ダブルタップ
  // 欠席−1
  // =========================

  function decrease(key) {

    const item =
      data[key];


    // 授業なし
    if (
      !item ||
      !item.exists
    ) {

      return;
    }


    // -------------------------
    // 欠席回数が1以上
    // -------------------------

    if (
      item.count > 0
    ) {

      item.count--;

    }


    // -------------------------
    // 欠席0回
    // → 授業を削除
    // -------------------------

    else {

      delete data[key];

    }


    save();

    createTable();
  }


  // =========================
  // 長押し
  // 欠席上限設定
  // =========================

  function setMax(key) {

    // -------------------------
    // 授業がない場合
    // -------------------------

    if (!data[key]) {

      data[key] = {

        exists: true,

        count: 0,

        max: null

      };

    }


    const current =
      data[key].max;


    // -------------------------
    // 入力
    // -------------------------

    const answer =
      prompt(
        "欠席できる最大回数を入力してください。\n" +
        "空欄にすると上限なし。",
        current === null
          ? ""
          : current
      );


    // キャンセル
    if (
      answer === null
    ) {

      return;
    }


    // -------------------------
    // 空欄
    // → 上限なし
    // -------------------------

    if (
      answer.trim() === ""
    ) {

      data[key].max = null;

    }


    // -------------------------
    // 数字
    // -------------------------

    else {

      const max =
        parseInt(
          answer,
          10
        );


      // 不正な入力
      if (
        isNaN(max) ||
        max < 0
      ) {

        alert(
          "0以上の数字を入力してください。"
        );

        return;
      }


      data[key].max = max;


      // -----------------------
      // 上限を下げた場合
      // -----------------------

      if (
        data[key].count > max
      ) {

        data[key].count = max;

      }

    }


    save();

    createTable();
  }


  // =========================
  // データ保存
  // =========================

  function save() {

    localStorage.setItem(
      "absenceCounter",
      JSON.stringify(data)
    );

  }


  // =========================
  // 初期表示
  // =========================

  createTable();

</script>

</body>
</html>
